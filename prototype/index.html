<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Switsh — Prototype mobile interactif</title>
<meta name="description" content="Prototype interactif de tous les écrans mobiles client Switsh, générés à partir du Business Requirements Document (BRD v4.1)." />

<link rel="preconnect" href="https://api.fontshare.com" />
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,500&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230B6E5C'/%3E%3Cpath d='M30.5 11c-1.8-3.2-5.3-5.3-9.3-5.3-6 0-10.4 4-10.4 8.8 0 4.4 3.2 6.6 8.4 7.8' stroke='white' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3Cpath d='M9.5 29c1.8 3.2 5.3 5.3 9.3 5.3 6 0 10.4-4 10.4-8.8 0-4.4-3.2-6.6-8.4-7.8' stroke='white' stroke-width='4' stroke-linecap='round' fill='none' opacity='0.5'/%3E%3C/svg%3E" />

<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/phone.css" />
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <div class="topbar-brand">
      <button class="icon-btn" id="sidebar-toggle" aria-label="Basculer la navigation" style="display:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span id="brand-mark"></span>
      <div class="topbar-titles">
        <strong>Switsh</strong>
        <span>Prototype mobile — expérience client</span>
      </div>
    </div>

    <div class="sidebar-search" style="flex:1;max-width:340px;margin:0 var(--space-4);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:var(--space-3);top:50%;transform:translateY(-50%);color:var(--color-text-faint);"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="sidebar-search-input" type="text" placeholder="Rechercher un écran (ex. cagnotte, KYC, carte…)" />
    </div>

    <div class="topbar-actions">
      <span class="pill-badge">34 écrans · BRD v4.1</span>
      <button class="icon-btn" id="spec-toggle" aria-label="Afficher la fiche BRD" style="display:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      </button>
      <button class="icon-btn" id="theme-toggle" aria-label="Changer de thème"></button>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar" aria-label="Navigation des écrans">
      <div id="sidebar-list"></div>
    </nav>

    <main class="phone-stage" id="phone-stage-content"></main>

    <aside class="spec-panel" aria-label="Fiche de spécification BRD" id="spec-panel-content"></aside>
  </div>
</div>

<script src="js/logo.js"></script>
<script src="js/groups.js"></script>
<script src="js/icons.js"></script>
<script src="js/helpers.js"></script>
<script src="js/data-start.js"></script>
<script src="js/data-onboarding.js"></script>
<script src="js/data-banking.js"></script>
<script src="js/data-cards.js"></script>
<script src="js/data-payments.js"></script>
<script src="js/data-pfm.js"></script>
<script src="js/data-support.js"></script>
<script src="js/data-settings.js"></script>
<script>
  document.getElementById('brand-mark').innerHTML = LOGO_MARK(26);
  document.getElementById('brand-mark').style.color = 'var(--color-primary)';
  document.getElementById('brand-mark').style.display = 'inline-flex';
  function syncChromeState() {
    document.getElementById('spec-toggle').style.display = window.innerWidth <= 1180 ? 'inline-flex' : 'none';
    document.getElementById('sidebar-toggle').style.display = window.innerWidth <= 860 ? 'inline-flex' : 'none';
    var tb = document.querySelector('.topbar');
    if (tb) document.documentElement.style.setProperty('--topbar-h', tb.offsetHeight + 'px');
  }
  syncChromeState();
  window.addEventListener('resize', syncChromeState);
</script>
<script src="js/app.js"></script>
</body>
</html>
